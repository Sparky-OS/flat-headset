name: Flat Headset iOS unsigned
on:
  push:
    branches: [order737]
    paths: ['ios/**', '.github/workflows/ios-unsigned.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      FLAT_HEADSET_IOS_MIN: '16.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report hosted image and verify iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          xcodebuild -version
          xcodebuild -showsdks
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - "$sdk_version" "$FLAT_HEADSET_IOS_MIN" <<'PY'
          import sys
          def version(value):
              return tuple(int(part) for part in value.split('.')[:2])
          if version(sys.argv[1]) < version(sys.argv[2]):
              sys.exit(f"The hosted iPhoneOS SDK {sys.argv[1]} is older than the required deployment target {sys.argv[2]}.")
          print(f"iPhoneOS SDK {sys.argv[1]} meets the requested SDK version floor {sys.argv[2]}.")
          PY
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native catalogs and portable picture generator
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Tools/check_localizations.py
          python3 ios/Tests/ToolingTest.py
          plutil -lint ios/Info.plist ios/FlatHeadset.xcodeproj/project.pbxproj
          cmake -S ios -B "$RUNNER_TEMP/flat-headset-tests" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/flat-headset-tests" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/flat-headset-tests" --output-on-failure
      - name: Build the unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/FlatHeadset.xcodeproj -scheme FlatHeadset \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/flat-headset-build" -jobs 4 \
            IPHONEOS_DEPLOYMENT_TARGET="$FLAT_HEADSET_IOS_MIN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' build
      - name: Package IPA and its receiver manifest entry
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/flat-headset-build/Build/Products/Release-iphoneos/FlatHeadset.app"
          test -d "$app"
          file "$app/FlatHeadset"
          xcrun lipo "$app/FlatHeadset" -verify_arch arm64
          if signature_result="$(LC_ALL=C codesign --verify "$app" 2>&1)"; then
            echo 'The app unexpectedly contains a signature; this workflow must produce an unsigned app.' >&2
            exit 1
          fi
          if [[ "$signature_result" != "$app: code object is not signed at all"$'\nIn architecture: arm64' ]]; then
            printf 'Could not establish that the app is unsigned: %s\n' "$signature_result" >&2
            exit 1
          fi
          printf '%s\n' "$signature_result"
          mkdir -p "$RUNNER_TEMP/flat-headset-package/Payload" "$GITHUB_WORKSPACE/ios-artifact"
          cp -R "$app" "$RUNNER_TEMP/flat-headset-package/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/flat-headset-package/Payload" "$GITHUB_WORKSPACE/ios-artifact/FlatHeadset-unsigned.ipa"
          python3 ios/Tools/package_manifest.py ios-artifact/FlatHeadset-unsigned.ipa --commit "$GITHUB_SHA"
      - name: Keep unsigned IPA and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlatHeadset-unsigned-${{ github.sha }}
          path: ios-artifact/
          if-no-files-found: error
          retention-days: 7
  iphone-core:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report hosted tools and verify core SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          xcodebuild -version
          xcodebuild -showsdks
          python3 --version
          cmake --version
          ninja --version
          pkg-config --version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - "$xcode_version" "$sdk_version" <<'PY'
          import sys
          if int(sys.argv[1].split('.')[0]) < 26 or int(sys.argv[2].split('.')[0]) < 16:
              sys.exit('The FreeRDP iPhone build requires Xcode 26 or newer and an iPhoneOS SDK supporting iOS 16.')
          if sys.version_info < (3, 12):
              sys.exit('Source extraction requires Python 3.12 or newer for its tar data filter.')
          PY
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch verified FreeRDP and codec sources
        run: python3 ios/Tools/fetch_core_sources.py "$RUNNER_TEMP/flat-headset-core-sources"
      - name: Build static iPhone core and link probe
        shell: bash
        run: bash ios/Tools/build_core.sh ios "$RUNNER_TEMP/flat-headset-core-sources" "$RUNNER_TEMP/flat-headset-core"
      - name: Package core libraries and provenance
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/flat-headset-core"
          sources="$RUNNER_TEMP/flat-headset-core-sources"
          package="$RUNNER_TEMP/flat-headset-core-package"
          mkdir -p "$package/licenses" "$GITHUB_WORKSPACE/ios-core-artifact"
          cp -R "$core/install/include" "$core/install/lib" "$package/"
          cp "$core/freerdp/core-link-check" "$core/core-link-load-commands.txt" "$package/"
          cp ios/Core/sources.json "$package/"
          cp "$sources/freerdp/LICENSE" "$package/licenses/FreeRDP-LICENSE"
          cp "$sources/openssl/LICENSE.txt" "$package/licenses/OpenSSL-LICENSE.txt"
          cp "$sources/ffmpeg/COPYING.LGPLv2.1" "$package/licenses/FFmpeg-COPYING.LGPLv2.1"
          printf '%s\n' "$GITHUB_SHA" > "$package/BUILD-COMMIT"
          cp "$core/freerdp/freerdp/include/freerdp/config.h" "$package/freerdp-build-config.h"
          cp "$core/ffmpeg/config.h" "$package/ffmpeg-build-config.h"
          cp "$core/ffmpeg/config_components.h" "$package/ffmpeg-components.h"
          tar -czf "$GITHUB_WORKSPACE/ios-core-artifact/FlatHeadset-core-arm64.tar.gz" -C "$package" .
          cd "$GITHUB_WORKSPACE/ios-core-artifact"
          shasum -a 256 FlatHeadset-core-arm64.tar.gz > SHA256SUMS
      - name: Keep unsigned iPhone core
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlatHeadset-core-arm64-${{ github.sha }}
          path: ios-core-artifact/
          if-no-files-found: error
          retention-days: 7
