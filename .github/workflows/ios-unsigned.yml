name: Flat Headset iOS unsigned
on:
  push:
    branches: [order737]
    paths: ['ios/**', '.github/workflows/ios-unsigned.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      FLAT_HEADSET_IOS_MIN: '16.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report hosted image and verify iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          xcodebuild -version
          xcodebuild -showsdks
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - "$sdk_version" "$FLAT_HEADSET_IOS_MIN" <<'PY'
          import sys
          def version(value):
              return tuple(int(part) for part in value.split('.')[:2])
          if version(sys.argv[1]) < version(sys.argv[2]):
              sys.exit(f"The hosted iPhoneOS SDK {sys.argv[1]} is older than the required deployment target {sys.argv[2]}.")
          print(f"iPhoneOS SDK {sys.argv[1]} meets the requested SDK version floor {sys.argv[2]}.")
          PY
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check native catalogs and portable picture generator
        shell: bash
        run: |
          set -euo pipefail
          python3 ios/Tools/check_localizations.py
          python3 ios/Tests/ToolingTest.py
          plutil -lint ios/Info.plist ios/FlatHeadset.xcodeproj/project.pbxproj
          cmake -S ios -B "$RUNNER_TEMP/flat-headset-tests" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/flat-headset-tests" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/flat-headset-tests" --output-on-failure
  iphone-core:
    needs: iphone
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            host_arch: arm64
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            artifact_suffix: ''
          - runner: macos-15-intel
            host_arch: x86_64
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
            artifact_suffix: '-intel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
      FLAT_HEADSET_IOS_MIN: '16.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report hosted tools and verify core SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          if [[ "$(uname -m)" != "$EXPECTED_HOST_ARCH" ]]; then
            echo 'The runner processor does not match this build. Check the runner label before retrying.' >&2
            exit 1
          fi
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo 'The selected Xcode 26 is missing. Check the runner inventory and update the explicit Xcode path.' >&2
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks
          printf 'Installed Xcode size (KiB; selected hosted installation, not download size):\n'
          du -sk "$DEVELOPER_DIR/.."
          python3 --version
          cmake --version
          ninja --version
          pkg-config --version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - "$xcode_version" "$sdk_version" <<'PY'
          import sys
          if int(sys.argv[1].split('.')[0]) < 26 or int(sys.argv[2].split('.')[0]) < 16:
              sys.exit('The FreeRDP iPhone build requires Xcode 26 or newer and an iPhoneOS SDK supporting iOS 16.')
          if sys.version_info < (3, 12):
              sys.exit('Source extraction requires Python 3.12 or newer for its tar data filter.')
          PY
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the hosted Metal compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun --sdk iphoneos metal --version; then
            echo 'The selected hosted Xcode needs its Metal Toolchain component. Installing it on this runner.'
            if ! xcodebuild -downloadComponent MetalToolchain; then
              echo 'The hosted Metal Toolchain download failed. Check the Xcode component download log and retry this job.' >&2
              exit 1
            fi
          fi
          if ! xcrun --sdk iphoneos metal --version; then
            echo 'The selected hosted Xcode still cannot run Metal. Check its Metal Toolchain installation before rebuilding.' >&2
            exit 1
          fi
      - name: Fetch verified FreeRDP and codec sources
        run: python3 ios/Tools/fetch_core_sources.py "$RUNNER_TEMP/flat-headset-core-sources"
      - name: Build static iPhone core and link probe
        shell: bash
        run: bash ios/Tools/build_core.sh ios "$RUNNER_TEMP/flat-headset-core-sources" "$RUNNER_TEMP/flat-headset-core"
      - name: Package core libraries and provenance
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/flat-headset-core"
          sources="$RUNNER_TEMP/flat-headset-core-sources"
          package="$RUNNER_TEMP/flat-headset-core-package"
          mkdir -p "$package/licenses" "$GITHUB_WORKSPACE/ios-core-artifact"
          python3 - "$core/install/lib" <<'PYCODE'
          import pathlib, sys
          modules = [p for p in pathlib.Path(sys.argv[1]).rglob('*') if p.suffix in ('.dylib', '.so')]
          if modules:
              sys.exit('The static iPhone core must not contain loadable modules: ' + ', '.join(map(str, modules)))
          PYCODE
          cp -R "$core/install/include" "$core/install/lib" "$package/"
          cp "$core/core-link-check" "$core/core-link-load-commands.txt" "$package/"
          cp ios/Core/sources.json "$package/"
          cp -R ios/Core/patches "$package/"
          cp "$sources/freerdp/LICENSE" "$package/licenses/FreeRDP-LICENSE"
          cp "$sources/openssl/LICENSE.txt" "$package/licenses/OpenSSL-LICENSE.txt"
          cp "$sources/ffmpeg/COPYING.LGPLv2.1" "$package/licenses/FFmpeg-COPYING.LGPLv2.1"
          printf '%s\n' "$GITHUB_SHA" > "$package/BUILD-COMMIT"
          cp "$core/freerdp/freerdp/include/freerdp/config.h" "$package/freerdp-build-config.h"
          cp "$core/ffmpeg/config.h" "$package/ffmpeg-build-config.h"
          cp "$core/ffmpeg/config_components.h" "$package/ffmpeg-components.h"
          tar -czf "$GITHUB_WORKSPACE/ios-core-artifact/FlatHeadset-core-arm64.tar.gz" -C "$package" .
          cd "$GITHUB_WORKSPACE/ios-core-artifact"
          shasum -a 256 FlatHeadset-core-arm64.tar.gz > SHA256SUMS
      - name: Keep unsigned iPhone core
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlatHeadset-core-arm64-${{ github.sha }}${{ matrix.artifact_suffix }}
          path: ios-core-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Build the unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/FlatHeadset.xcodeproj -scheme FlatHeadset \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/flat-headset-build" -jobs 4 \
            IPHONEOS_DEPLOYMENT_TARGET="$FLAT_HEADSET_IOS_MIN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            FH_CORE_PREFIX="$RUNNER_TEMP/flat-headset-core/install" \
            DEVELOPMENT_TEAM='' build
      - name: Package IPA and its receiver manifest entry
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/flat-headset-build/Build/Products/Release-iphoneos/FlatHeadset.app"
          test -d "$app"
          file "$app/FlatHeadset"
          xcrun lipo "$app/FlatHeadset" -verify_arch arm64
          if signature_result="$(LC_ALL=C codesign --verify "$app" 2>&1)"; then
            echo 'The app unexpectedly contains a signature; this workflow must produce an unsigned app.' >&2
            exit 1
          fi
          if [[ "$signature_result" != "$app: code object is not signed at all"$'\nIn architecture: arm64' ]]; then
            printf 'Could not establish that the app is unsigned: %s\n' "$signature_result" >&2
            exit 1
          fi
          printf '%s\n' "$signature_result"
          mkdir -p "$RUNNER_TEMP/flat-headset-package/Payload" "$GITHUB_WORKSPACE/ios-artifact"
          cp -R "$app" "$RUNNER_TEMP/flat-headset-package/Payload/"
          licenses="$RUNNER_TEMP/flat-headset-package/Payload/FlatHeadset.app/Licenses"
          mkdir -p "$licenses"
          cp "$RUNNER_TEMP/flat-headset-core-sources/openssl/LICENSE.txt" "$licenses/OpenSSL.txt"
          cp "$RUNNER_TEMP/flat-headset-core-sources/freerdp/LICENSE" "$licenses/FreeRDP.txt"
          cp "$RUNNER_TEMP/flat-headset-core-sources/ffmpeg/COPYING.LGPLv2.1" "$licenses/FFmpeg-LGPLv2.1.txt"
          cp ios/ThirdParty/nlohmann/LICENSE.MIT "$licenses/nlohmann-json.txt"
          cp ios/COPYING "$licenses/FlatHeadset.txt"
          cp ios/ThirdParty/Cardboard/LICENSE "$licenses/Cardboard-Apache-2.0.txt"
          ditto -c -k --keepParent "$RUNNER_TEMP/flat-headset-package/Payload" "$GITHUB_WORKSPACE/ios-artifact/FlatHeadset-unsigned.ipa"
          python3 ios/Tools/package_manifest.py ios-artifact/FlatHeadset-unsigned.ipa --commit "$GITHUB_SHA"
      - name: Keep unsigned IPA and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlatHeadset-unsigned-${{ github.sha }}${{ matrix.artifact_suffix }}
          path: ios-artifact/
          if-no-files-found: error
          retention-days: 7

  kdeconnect-iphone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            host_arch: arm64
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            artifact_suffix: ''
          - runner: macos-15-intel
            host_arch: x86_64
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
            artifact_suffix: '-intel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
      KDECONNECT_COMMIT: 57d3725b5f76f71c5758dd10a0648d4d356fa476
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report hosted image and SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          if [[ "$(uname -m)" != "$EXPECTED_HOST_ARCH" ]]; then
            echo 'The runner processor does not match this build. Check the runner label before retrying.' >&2
            exit 1
          fi
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo 'The selected Xcode 26 is missing. Check the runner inventory and update the explicit Xcode path.' >&2
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - "$sdk_version" <<'PYCODE'
          import sys
          if int(sys.argv[1].split('.')[0]) < 16:
              sys.exit('The hosted iPhoneOS SDK is older than the iOS 16 deployment target.')
          PYCODE
      - name: Check out the pinned KDE Connect source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sparky-OS/kdeconnect-ios
          ref: ${{ env.KDECONNECT_COMMIT }}
          persist-credentials: false
      - name: Build unsigned KDE Connect and check its protocol
        shell: bash
        run: bash Sparky/build_unsigned.sh "$RUNNER_TEMP/kdeconnect-iphone"
      - name: Package KDE Connect and its renewal entry
        shell: bash
        run: bash Sparky/package_unsigned.sh "$RUNNER_TEMP/kdeconnect-iphone" "$GITHUB_WORKSPACE/kdeconnect-artifact" "$KDECONNECT_COMMIT" "$GITHUB_SHA"
      - name: Keep unsigned KDE Connect IPA and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KDEConnect-unsigned-${{ github.sha }}${{ matrix.artifact_suffix }}
          path: kdeconnect-artifact/
          if-no-files-found: error
          retention-days: 7

  cardboard-iphone:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            host_arch: arm64
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            artifact_suffix: ''
          - runner: macos-15-intel
            host_arch: x86_64
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
            artifact_suffix: '-intel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
      CARDBOARD_COMMIT: d8ba9bce45c2325ff291dd894aa294eca4beb60a
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report hosted image and SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          if [[ "$(uname -m)" != "$EXPECTED_HOST_ARCH" ]]; then
            echo 'The runner processor does not match this build. Check the runner label before retrying.' >&2
            exit 1
          fi
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo 'The selected Xcode 26 is missing. Check the runner inventory and update the explicit Xcode path.' >&2
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          python3 - "$sdk_version" <<'PYCODE'
          import sys
          if int(sys.argv[1].split('.')[0]) < 16:
              sys.exit('The hosted iPhoneOS SDK is older than the iOS 16 deployment target.')
          PYCODE
      - name: Check out shared receiver profile validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: flat-headset
          persist-credentials: false
      - name: Check out the pinned Cardboard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sparky-OS/cardboard
          ref: ${{ env.CARDBOARD_COMMIT }}
          path: cardboard
          persist-credentials: false
      - name: Build unsigned Cardboard and check profile handoff
        shell: bash
        run: bash cardboard/profile-ios/Tools/build_unsigned.sh "$RUNNER_TEMP/cardboard-iphone"
      - name: Package Cardboard and its renewal entry
        shell: bash
        run: bash cardboard/profile-ios/Tools/package_unsigned.sh "$RUNNER_TEMP/cardboard-iphone" "$GITHUB_WORKSPACE/cardboard-artifact" "$CARDBOARD_COMMIT" "$GITHUB_SHA"
      - name: Keep unsigned Cardboard IPA and hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cardboard-unsigned-${{ github.sha }}${{ matrix.artifact_suffix }}
          path: cardboard-artifact/
          if-no-files-found: error
          retention-days: 7

  mac-session-intel:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report the Intel session host
        shell: bash
        run: |
          set -euo pipefail
          printf 'Hosted image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -m
          test "$(uname -m)" = x86_64
          xcodebuild -version
          xcodebuild -showsdks
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain || { echo 'Metal Toolchain installation failed; inspect the component log and retry.' >&2; exit 1; }
          fi
          xcrun --sdk iphoneos metal --version
      - name: Check out the session helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the session failure branches without a phone
        shell: bash
        run: python3 ios/Tests/MacSessionTest.py
      - name: Print the installed command documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mac-session-manuals"
          python3 - "$RUNNER_TEMP/mac-session-manuals" <<'PYCODE'
          from pathlib import Path
          import os, subprocess, sys
          folder = Path(sys.argv[1])
          commands = {
              'xcodebuild': ['xcodebuild', '-help'],
              'devicectl': ['xcrun', 'devicectl', 'help'],
              'xcdevice': ['xcrun', 'xcdevice', '--help'],
              'xcresulttool': ['xcrun', 'xcresulttool', 'help'],
              'security': ['man', 'security'],
              'codesign': ['man', 'codesign'],
          }
          for name, command in commands.items():
              result = subprocess.run(command, capture_output=True, env=dict(os.environ, MANPAGER='cat'))
              output = result.stdout + result.stderr
              (folder / (name + '.txt')).write_bytes(output)
              print(name, 'documentation command exit:', result.returncode)
              if not output:
                  sys.exit('No documentation output for ' + name + '; inspect the selected Xcode tools.')
          PYCODE
      - name: Build all three pinned sources through the unsigned session path
        shell: bash
        run: bash ios/Tools/Mac/first-session.sh --unsigned --work "$RUNNER_TEMP/mac-session"
      - name: Keep the session IPAs, checksums and command documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mac-session-unsigned-${{ github.sha }}-intel
          path: |
            ${{ runner.temp }}/mac-session/session-*/*-unsigned.ipa
            ${{ runner.temp }}/mac-session/session-*/*-unsigned.sha256
            ${{ runner.temp }}/mac-session-manuals/
          if-no-files-found: error
          retention-days: 7
      - name: Keep build logs if the session proof fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mac-session-build-logs-${{ github.sha }}-intel
          path: ${{ runner.temp }}/mac-session/session-*/*.log
          if-no-files-found: ignore
          retention-days: 7
